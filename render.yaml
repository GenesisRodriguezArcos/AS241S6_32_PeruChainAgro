services:
  # Backend API (desde Docker Hub)
  - type: web
    name: peruchainagro-backend
    runtime: image
    plan: free
    image:
      url: docker.io/genesis2006/peruchainagro-backend:latest
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_VganO5sDjHE2@ep-soft-mouse-b4hvq28z-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "*"

  # Frontend (desde Docker Hub)
  - type: web
    name: peruchainagro-frontend
    runtime: image
    plan: free
    image:
      url: docker.io/genesis2006/peruchainagro-frontend:latest
    envVars:
      - key: VITE_API_URL
        value: https://peruchainagro-backend.onrender.com
